<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属 AI RP</title>
    
    <style>
        /* 基础样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; /* 适配手机 */
            background: #1a1a1a; color: #eee; 
            font-family: sans-serif; overflow: hidden;
        }
        
        button { cursor: pointer; touch-action: manipulation; }
        button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #c69aff; outline-offset: 2px; }
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; background: #252525; border-bottom: 1px solid #333; z-index: 10;
        }
        header h2 { font-size: 16px; color: #e0c3fc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
        header button { background: none; border: none; color: #ddd; font-size: 14px; min-height: 44px; padding: 8px; white-space: nowrap; }

        main { flex: 1; min-height: 0; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; overscroll-behavior: contain; }
        
        .message { max-width: 85%; padding: 12px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; }
        .message.user { align-self: flex-end; background: #7b2cbf; color: #fff; }
        .message.assistant { align-self: flex-start; background: #2d2d2d; color: #ddd; border: 1px solid #333; }
        
        .message .actions { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; opacity: 0.7; display: flex; gap: 15px; }
        .message .actions button { background: transparent; border: 0; color: #ddd; min-height: 36px; font-size: 13px; }

        footer { display: flex; padding: 10px 15px max(10px, env(safe-area-inset-bottom)); background: #252525; border-top: 1px solid #333; gap: 10px; align-items: flex-end; }
        footer textarea { flex: 1; min-width: 0; resize: none; height: 44px; max-height: 120px; padding: 11px 12px; border-radius: 18px; border: 1px solid #555; background: #333; color: #fff; font-size: 16px; line-height: 22px; }
        footer button { background: #7b2cbf; color: white; border: none; padding: 0 18px; min-height: 44px; border-radius: 18px; font-size: 15px; }
        footer button:disabled { background: #555; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal.hidden { display: none !important; }
        .modal-content { background: #252525; border-radius: 15px; width: 100%; max-width: 500px; max-height: min(90vh, 90dvh); display: flex; flex-direction: column; border: 1px solid #444; overflow: hidden; }
        .modal-title { padding: 18px 18px 8px; color: #e0c3fc; font-size: 18px; }
        .tabs { display: flex; gap: 6px; padding: 8px 18px 12px; border-bottom: 1px solid #444; }
        .tabs button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: #383838; color: #ddd; font-size: 14px; }
        .tabs button[aria-selected="true"] { background: #7b2cbf; color: #fff; }
        .tab-panel { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; padding: 14px 18px 20px; }
        .tab-panel[hidden] { display: none; }
        .modal-content h3 { font-size: 14px; color: #e0c3fc; margin-top: 5px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #555; background: #333; color: #fff; font-size: 16px; }
        .modal-content textarea { min-height: 100px; resize: vertical; }
        .modal-content label { display: block; color: #ddd; font-size: 14px; }
        .modal-content label input, .modal-content label textarea { margin-top: 6px; }
        .modal-content .hint { color: #aaa; font-size: 12px; line-height: 1.5; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid #444; }
        .modal-buttons button { min-height: 44px; padding: 8px 18px; border-radius: 8px; border: none; font-size: 14px; }
        #btn-save { background: #7b2cbf; color: white; }
        #btn-close { background: #444; color: #ccc; }
        
        .mini-theater { padding: 0 15px; }
        @media (max-width: 600px) { .modal { padding: 0; align-items: stretch; } .modal-content { max-width: none; max-height: 100dvh; border-radius: 0; border: 0; } .message { max-width: 92%; } }
    </style>
</head>
<body>

    <header>
        <button id="btn-settings" type="button">⚙️ 设定</button>
        <h2 id="char-name">未命名角色</h2>
        <button id="btn-clear" type="button">🗑️ 清空</button>
    </header>

    <style id="user-global-css"></style>
    <div id="mini-theater" class="mini-theater"></div>

    <main id="chat-container"></main>

    <footer>
        <textarea id="user-input" placeholder="输入消息..."></textarea>
        <button id="btn-send" type="button">发送</button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设定">
        <div class="modal-content">
            <h2 class="modal-title">设定</h2>
            <div class="tabs" role="tablist" aria-label="设定分类">
                <button type="button" role="tab" aria-selected="true" aria-controls="panel-character" id="tab-character" data-tab="character">🎭 角色</button>
                <button type="button" role="tab" aria-selected="false" aria-controls="panel-api" id="tab-api" data-tab="api">🔌 连接</button>
                <button type="button" role="tab" aria-selected="false" aria-controls="panel-style" id="tab-style" data-tab="style">🎨 美化</button>
            </div>
            <section class="tab-panel" id="panel-character" role="tabpanel" aria-labelledby="tab-character">
                <label>角色名字<input type="text" id="set-name" placeholder="角色名字"></label>
                <label>角色人设<textarea id="set-persona" placeholder="性格、经历、说话方式..."></textarea></label>
                <label>用户面具<textarea id="set-user-persona" placeholder="AI 如何看待你..."></textarea></label>
                <label>开场白<textarea id="set-first-message" placeholder="角色说的第一句话..."></textarea></label>
            </section>
            <section class="tab-panel" id="panel-api" role="tabpanel" aria-labelledby="tab-api" hidden>
                <p class="hint">填入兼容 OpenAI 聊天接口的地址、密钥和模型名。</p>
                <label>API 地址<input type="url" id="set-api-url" inputmode="url" placeholder="https://api.example.com/v1"></label>
                <label>API Key<input type="password" id="set-api-key" autocomplete="off" placeholder="你的 API Key"></label>
                <label>模型名<input type="text" id="set-model" placeholder="模型名称"></label>
            </section>
            <section class="tab-panel" id="panel-style" role="tabpanel" aria-labelledby="tab-style" hidden>
                <label>全局美化（CSS）<textarea id="set-css" placeholder="输入 CSS 代码..."></textarea></label>
                <label>小剧场（HTML）<textarea id="set-theater" placeholder="输入 HTML 代码..."></textarea></label>
            </section>
            <div class="modal-buttons">
                <button id="btn-close" type="button">关闭</button>
                <button id="btn-save" type="button">保存设定</button>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let state = {
            name: '新角色', persona: '', userPersona: '', firstMessage: '',
            apiUrl: '', apiKey: '', model: '',
            globalCss: '', miniTheater: '', history: []
        };
        let isGenerating = false;

        // 获取元素
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const settingsModal = document.getElementById('settings-modal');

        // 1. 读取本地存档
        function loadState() {
            try {
                const saved = localStorage.getItem('ai_rp_save');
                if (saved) state = Object.assign(state, JSON.parse(saved));
            } catch (e) { alert('读取存档失败'); }
            renderUI();
        }

        // 2. 保存到本地
        function saveState() {
            localStorage.setItem('ai_rp_save', JSON.stringify(state));
        }

        // 3. 渲染界面
        function renderUI() {
            document.getElementById('char-name').innerText = state.name || '未命名角色';
            document.getElementById('user-global-css').innerHTML = state.globalCss;
            document.getElementById('mini-theater').innerHTML = state.miniTheater;
            
            chatContainer.innerHTML = '';
            state.history.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = 'message ' + msg.role;
                
                // 简单的换行处理（替代Markdown）
                div.innerText = msg.content; 
                
                if (msg.role === 'assistant') {
                    const actions = document.createElement('div');
                    actions.className = 'actions';
                    actions.innerHTML = '<button type="button" onclick="regenerate(' + index + ')">🔄 重新生成</button> <button type="button" onclick="deleteMessage(' + index + ')">🗑️ 删除</button>';
                    div.appendChild(actions);
                }
                chatContainer.appendChild(div);
            });
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        // 4. 发送消息
        async function sendMessage(userText) {
            if (isGenerating || !userText.trim()) return;
            if (!state.apiUrl || !state.apiKey) {
                alert('请先在【设定】中填写 API URL 和 API Key！');
                return;
            }

            isGenerating = true;
            btnSend.disabled = true;
            btnSend.innerText = '...';

            state.history.push({ role: 'user', content: userText });
            userInput.value = '';
            renderUI();

            const systemPrompt = '你正在扮演：' + state.name + '。人设：' + (state.persona || '无') + '。用户设定：' + (state.userPersona || '普通用户') + '。请严格以角色的口吻回复，直接输出回复，不要带任何前缀。';
            const contextHistory = state.history.slice(-15);
            
            try {
                const response = await fetch(state.apiUrl.replace(/\/$/, '') + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.apiKey },
                    body: JSON.stringify({ model: state.model, messages: [{ role: 'system', content: systemPrompt }].concat(contextHistory), stream: true })
                });

                if (!response.ok) throw new Error('API 错误: ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiReply = '';
                
                state.history.push({ role: 'assistant', content: '' });
                const currentIndex = state.history.length - 1;
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message assistant';
                chatContainer.appendChild(aiDiv);

                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0]?.delta?.content || '';
                                if (content) {
                                    aiReply += content;
                                    aiDiv.innerText = aiReply; // 纯文本渲染
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                     } catch (e) {}
                        }
                    }
                }
                state.history[currentIndex].content = aiReply;
                saveState();
                renderUI();

            } catch (error) {
                alert('请求失败：' + error.message);
                if (state.history[state.history.length - 1].role === 'assistant') state.history.pop();
                renderUI();
            } finally {
                isGenerating = false;
                btnSend.disabled = false;
                btnSend.innerText = '发送';
            }
        }

        // 5. 重新生成
        window.regenerate = function(index) {
            if (isGenerating) return;
            state.history = state.history.slice(0, index);
            const lastUserMsg = state.history.filter(m => m.role === 'user').pop();
            if (lastUserMsg) {
                state.history.pop();
                renderUI();
                sendMessage(lastUserMsg.content);
            }
        };

        // 6. 删除单条消息
        window.deleteMessage = function(index) {
            if (isGenerating) return;
            if (confirm('确定删除这条回复吗？')) {
                state.history.splice(index, 1);
                saveState();
                renderUI();
            }
        };

        // 7. 绑定事件 (使用 addEventListener 更加稳定)
        btnSend.addEventListener('click', function() { sendMessage(userInput.value); });
        userInput.addEventListener('input', function() {
            userInput.style.height = '44px';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });
        userInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                sendMessage(userInput.value);
            }
        });
        document.querySelectorAll('[data-tab]').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('[data-tab]').forEach(function(item) {
                    item.setAttribute('aria-selected', String(item === tab));
                });
                document.querySelectorAll('.tab-panel').forEach(function(panel) {
                    panel.hidden = panel.id !== 'panel-' + tab.dataset.tab;
                });
            });
        });
        
        document.getElementById('btn-clear').addEventListener('click', function() {
            if (confirm('确定清空所有聊天记录吗？')) {
                state.history = [];
                saveState();
                renderUI();
            }
        });

        document.getElementById('btn-settings').addEventListener('click', function() {
            document.getElementById('set-name').value = state.name;
            document.getElementById('set-persona').value = state.persona;
            document.getElementById('set-user-persona').value = state.userPersona;
            document.getElementById('set-first-message').value = state.firstMessage;
            document.getElementById('set-api-url').value = state.apiUrl;
            document.getElementById('set-api-key').value = state.apiKey;
            document.getElementById('set-model').value = state.model;
            document.getElementById('set-css').value = state.globalCss;
            document.getElementById('set-theater').value = state.miniTheater;
            settingsModal.classList.remove('hidden');
            document.getElementById('tab-character').click();
        });

        document.getElementById('btn-save').addEventListener('click', function() {
            state.name = document.getElementById('set-name').value.trim() || '未命名角色';
            state.persona = document.getElementById('set-persona').value.trim();
            state.userPersona = document.getElementById('set-user-persona').value.trim();
            state.firstMessage = document.getElementById('set-first-message').value.trim();
            state.apiUrl = document.getElementById('set-api-url').value.trim();
            state.apiKey = document.getElementById('set-api-key').value.trim();
            state.model = document.getElementById('set-model').value.trim();
            state.globalCss = document.getElementById('set-css').value.trim();
            state.miniTheater = document.getElementById('set-theater').value.trim();
            
            if (state.history.length === 0 && state.firstMessage) {
                state.history.push({ role: 'assistant', content: state.firstMessage });
            }
            saveState();
            renderUI();
            settingsModal.classList.add('hidden');
        });

        document.getElementById('btn-close').addEventListener('click', function() {
            settingsModal.classList.add('hidden');
        });

        // 启动
        loadState();
    </script>
</body>
</html>
```
