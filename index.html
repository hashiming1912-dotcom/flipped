
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的专属 AI RP</title>
    <!-- 引入 Markdown 渲染和 HTML 过滤库 (需要联网加载) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    
    <style>
        /* ================= 基础样式 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            display: flex; flex-direction: column; 
            height: 100dvh; /* 适配手机浏览器底部栏 */
            background: #1a1a1a; color: #eee; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden;
        }
        
        /* 顶部栏 */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; background: #252525; 
            border-bottom: 1px solid #333; z-index: 10;
        }
        header h2 { font-size: 16px; font-weight: 500; color: #e0c3fc; }
        header button { 
            background: none; border: none; color: #aaa; 
            font-size: 14px; cursor: pointer; padding: 5px;
        }
        header button:active { color: #fff; }

        /* 聊天区 */
        main { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 15px; 
        }
        
        /* 消息气泡 */
        .message { 
            max-width: 85%; padding: 12px; border-radius: 12px; 
            line-height: 1.6; word-wrap: break-word; font-size: 15px;
            position: relative;
        }
        .message.user { 
            align-self: flex-end; background: #7b2cbf; 
            color: #fff; border-bottom-right-radius: 2px; 
        }
        .message.assistant { 
            align-self: flex-start; background: #2d2d2d; 
            color: #ddd; border-bottom-left-radius: 2px; 
            border: 1px solid #333;
        }
        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        
        /* 消息操作按钮 */
        .message .actions { 
            margin-top: 10px; padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px; opacity: 0.7; display: flex; gap: 15px; 
        }
        .message .actions span { cursor: pointer; color: #bbb; }
        .message .actions span:active { color: #fff; }

        /* 底部输入区 */
        footer { 
            display: flex; padding: 12px 15px; background: #252525; 
            border-top: 1px solid #333; gap: 10px; align-items: flex-end;
        }
        footer textarea { 
            flex: 1; resize: none; height: 42px; max-height: 120px;
            padding: 10px 12px; border-radius: 20px; border: 1px solid #444; 
            background: #333; color: #fff; font-size: 15px; 
            font-family: inherit; line-height: 1.4;
        }
        footer textarea:focus { outline: none; border-color: #7b2cbf; }
        footer button { 
            background: #7b2cbf; color: white; border: none; 
            padding: 0 20px; height: 42px; border-radius: 20px; 
            font-size: 15px; font-weight: bold; flex-shrink: 0;
        }
        footer button:active { background: #5a1a8a; }
        footer button:disabled { background: #555; color: #888; }

        /* 设置弹窗 */
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; 
            align-items: center; z-index: 100; padding: 15px;
        }
        .modal.hidden { display: none; }
        .modal-content { 
            background: #252525; padding: 20px; border-radius: 15px; 
            width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 12px;
            border: 1px solid #444;
        }
        .modal-content h3 { font-size: 15px; color: #e0c3fc; margin-top: 5px; }
        .modal-content input, .modal-content textarea { 
            width: 100%; padding: 10px; border-radius: 8px; 
            border: 1px solid #444; background: #333; color: #fff; 
            font-family: inherit; font-size: 14px;
        }
        .modal-content textarea { height: 80px; resize: vertical; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; }
        #btn-save { background: #7b2cbf; color: white; }
        #btn-close { background: #444; color: #ccc; }

        /* 全局注入区 & 小剧场 */
        .mini-theater { padding: 0 15px; empty-cells: hide; }
        /* 用户自定义 CSS 将在这里生效 */
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <header>
        <button id="btn-settings">⚙️ 设定</button>
        <h2 id="char-name">未命名角色</h2>
        <button id="btn-clear">🗑️ 清空</button>
    </header>

    <!-- 全局美化 & 小剧场渲染区 -->
    <style id="user-global-css"></style>
    <div id="mini-theater" class="mini-theater"></div>

    <!-- 聊天记录区 -->
    <main id="chat-container"></main>

    <!-- 底部输入区 -->
    <footer>
        <textarea id="user-input" placeholder="输入消息..."></textarea>
        <button id="btn-send">发送</button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🎭 角色设定 (Character)</h3>
            <input type="text" id="set-name" placeholder="角色名字">
            <textarea id="set-persona" placeholder="角色人设（外貌、性格、经历、世界观等）"></textarea>
            
            <h3>👤 用户面具 (User Persona)</h3>
            <textarea id="set-user-persona" placeholder="AI如何看待你（如：称呼你为老板，你是他的恋人等）"></textarea>
            
            <h3>📝 开场白与文风</h3>
            <textarea id="set-first-message" placeholder="开场白文本（直接输入文字即可）"></textarea>

            <h3>🔌 API 设置</h3>
            <input type="text" id="set-api-url" placeholder="API Base URL (如 https://api.openai.com/v1)">
            <input type="password" id="set-api-key" placeholder="API Key (sk-...)">
            <input type="text" id="set-model" placeholder="模型名 (如 gpt-4o, claude-3-5-sonnet)">

            <h3>🎨 全局美化 (输入 CSS)</h3>
            <textarea id="set-css" placeholder="这里输入CSS代码，不要加 <style> 标签，例如：body { background: #000; }"></textarea>

            <h3>🎬 小剧场 (输入 HTML/SVG)</h3>
            <textarea id="set-theater" placeholder="输入 HTML 或 SVG 代码，用于渲染按钮、音乐播放器等组件"></textarea>

            <div class="modal-buttons">
                <button id="btn-close">关闭</button>
                <button id="btn-save">保存设定</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 状态管理 =================
        let state = {
            name: '新角色',
            persona: '',
            userPersona: '用户',
            firstMessage: '',
            apiUrl: 'https://api.openai.com/v1',
            apiKey: '',
            model: 'gpt-3.5-turbo',
            globalCss: '',
            miniTheater: '',
            history: [] // 格式: [{ role: 'user'|'assistant', content: '...' }]
        };

        let isGenerating = false; // 防止重复发送

        // ================= DOM 元素 =================
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const settingsModal = document.getElementById('settings-modal');
        const charNameEl = document.getElementById('char-name');

        // ================= 数据持久化 =================
        function loadState() {
            const saved = localStorage.getItem('ai_rp_state_v1');
            if (saved) {
                try {
                    state = { ...state, ...JSON.parse(saved) };
                } catch (e) { console.error('读取存档失败', e); }
            }
            renderUI();
        }

        function saveState() {
            localStorage.setItem('ai_rp_state_v1', JSON.stringify(state));
        }

        // ================= 渲染界面 =================
        function renderUI() {
            charNameEl.innerText = state.name || '未命名角色';
            
            // 1. 注入全局 CSS
            document.getElementById('user-global-css').innerHTML = state.globalCss;
            
            // 2. 注入小剧场 (使用 DOMPurify 过滤)
            document.getElementById('mini-theater').innerHTML = DOMPurify.sanitize(state.miniTheater);
            
            // 3. 渲染聊天记录
            chatContainer.innerHTML = '';
            state.history.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                
                // 解析 Markdown 并过滤 HTML
                const parsedContent = marked.parse(msg.content);
                div.innerHTML = DOMPurify.sanitize(parsedContent);
                
                // 给 AI 的消息添加操作按钮
                if (msg.role === 'assistant') {
                    const actions = document.createElement('div');
                    actions.className = 'actions';
                    actions.innerHTML = `
                        <span onclick="regenerate(${index})">🔄 重新生成</span> 
                        <span onclick="deleteMessage(${index})">🗑️ 删除这条</span>
                    `;
                    div.appendChild(actions);
                }
                chatContainer.appendChild(div);
            });
            
            // 滚动到底部
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        // ================= 核心逻辑
