<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的专属 AI RP (离线保底版)</title>
    
    <style>
        /* 基础样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh; /* 适配手机 */
            background: #1a1a1a; color: #eee; 
            font-family: sans-serif; overflow: hidden;
        }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; background: #252525; border-bottom: 1px solid #333; z-index: 10;
        }
        header h2 { font-size: 16px; color: #e0c3fc; }
        header button { background: none; border: none; color: #aaa; font-size: 14px; padding: 5px; }

        main { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 85%; padding: 12px; border-radius: 12px; line-height: 1.5; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; }
        .message.user { align-self: flex-end; background: #7b2cbf; color: #fff; }
        .message.assistant { align-self: flex-start; background: #2d2d2d; color: #ddd; border: 1px solid #333; }
        
        .message .actions { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; opacity: 0.7; display: flex; gap: 15px; }
        .message .actions span { cursor: pointer; color: #bbb; }

        footer { display: flex; padding: 12px 15px; background: #252525; border-top: 1px solid #333; gap: 10px; align-items: flex-end; }
        footer textarea { flex: 1; resize: none; height: 42px; max-height: 120px; padding: 10px 12px; border-radius: 20px; border: 1px solid #444; background: #333; color: #fff; font-size: 15px; }
        footer button { background: #7b2cbf; color: white; border: none; padding: 0 20px; height: 42px; border-radius: 20px; font-size: 15px; }
        footer button:disabled { background: #555; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
        .modal.hidden { display: none !important; }
        .modal-content { background: #252525; padding: 20px; border-radius: 15px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444; }
        .modal-content h3 { font-size: 14px; color: #e0c3fc; margin-top: 5px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px; }
        .modal-content textarea { height: 70px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; }
        #btn-save { background: #7b2cbf; color: white; }
        #btn-close { background: #444; color: #ccc; }
        
        .mini-theater { padding: 0 15px; }
    </style>
</head>
<body>

    <header>
        <button id="btn-settings" type="button">⚙️ 设定</button>
        <h2 id="char-name">未命名角色</h2>
        <button id="btn-clear" type="button">🗑️ 清空</button>
    </header>

    <style id="user-global-css"></style>
    <div id="mini-theater" class="mini-theater"></div>

    <main id="chat-container"></main>

    <footer>
        <textarea id="user-input" placeholder="输入消息..."></textarea>
        <button id="btn-send" type="button">发送</button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🎭 角色设定</h3>
            <input type="text" id="set-name" placeholder="角色名字">
            <textarea id="set-persona" placeholder="角色人设..."></textarea>
            
            <h3>👤 用户面具</h3>
            <textarea id="set-user-persona" placeholder="AI如何看待你..."></textarea>
            
            <h3>📝 开场白</h3>
            <textarea id="set-first-message" placeholder="角色说的第一句话..."></textarea>

            <h3>🔌 API 设置</h3>
            <input type="text" id="set-api-url" placeholder="API URL (如 https://api.openai.com/v1)">
            <input type="password" id="set-api-key" placeholder="API Key">
            <input type="text" id="set-model" placeholder="模型名 (如 gpt-3.5-turbo)">

            <h3>🎨 全局美化 (CSS)</h3>
            <textarea id="set-css" placeholder="输入CSS代码..."></textarea>

            <h3>🎬 小剧场 (HTML)</h3>
            <textarea id="set-theater" placeholder="输入HTML代码..."></textarea>

            <div class="modal-buttons">
                <button id="btn-close" type="button">关闭</button>
                <button id="btn-save" e="button">保存设定</button>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let state = {
            name: '新角色', persona: '', userPersona: '', firstMessage: '',
            apiUrl: '', apiKey: '', model: '',
            globalCss: '', miniTheater: '', history: []
        };
        let isGenerating = false;

        // 获取元素
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const btnSend = document.getElementById('btn-send');
        const settingsModal = document.getElementById('settings-modal');

        // 1. 读取本地存档
        function loadState() {
            try {
                const saved = localStorage.getItem('ai_rp_save');
                if (saved) state = Object.assign(state, JSON.parse(saved));
            } catch (e) { alert('读取存档失败'); }
            renderUI();
        }

        // 2. 保存到本地
        function saveState() {
            localStorage.setItem('ai_rp_save', JSON.stringify(state));
        }

        // 3. 渲染界面
        function renderUI() {
            document.getElementById('char-name').innerText = state.name || '未命名角色';
            document.getElementById('user-global-css').innerHTML = state.globalCss;
            document.getElementById('mini-theater').innerHTML = state.miniTheater;
            
            chatContainer.innerHTML = '';
            state.history.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = 'message ' + msg.role;
                
                // 简单的换行处理（替代Markdown）
                div.innerText = msg.content; 
                
                if (msg.role === 'assistant') {
                    const actions = document.createElement('div');
                    actions.className = 'actions';
                    actions.innerHTML = '<span onclick="regenerate(' + index + ')">🔄 重新生成</span> <span onclick="deleteMessage(' + index + ')">🗑️ 删除</span>';
                    div.appendChild(actions);
                }
                chatContainer.appendChild(div);
            });
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        // 4. 发送消息
        async function sendMessage(userText) {
            if (isGenerating || !userText.trim()) return;
            if (!state.apiUrl || !state.apiKey) {
                alert('请先在【设定】中填写 API URL 和 API Key！');
                return;
            }

            isGenerating = true;
            btnSend.disabled = true;
            btnSend.innerText = '...';

            state.history.push({ role: 'user', content: userText });
            userInput.value = '';
            renderUI();

            const systemPrompt = '你正在扮演：' + state.name + '。人设：' + (state.persona || '无') + '。用户设定：' + (state.userPersona || '普通用户') + '。请严格以角色的口吻回复，直接输出回复，不要带任何前缀。';
            const contextHistory = state.history.slice(-15);
            
            try {
                const response = await fetch(state.apiUrl.replace(/\/$/, '') + '/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.apiKey },
                    body: JSON.stringify({ model: state.model, messages: [{ role: 'system', content: systemPrompt }].concat(contextHistory), stream: true })
                });

                if (!response.ok) throw new Error('API 错误: ' + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiReply = '';
                
                state.history.push({ role: 'assistant', content: '' });
                const currentIndex = state.history.length - 1;
                
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message assistant';
                chatContainer.appendChild(aiDiv);

                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0]?.delta?.content || '';
                                if (content) {
                                    aiReply += content;
                                    aiDiv.innerText = aiReply; // 纯文本渲染
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                     } catch (e) {}
                        }
                    }
                }
                state.history[currentIndex].content = aiReply;
                saveState();
                renderUI();

            } catch (error) {
                alert('请求失败：' + error.message);
                if (state.history[state.history.length - 1].role === 'assistant') state.history.pop();
                renderUI();
            } finally {
                isGenerating = false;
                btnSend.disabled = false;
                btnSend.innerText = '发送';
            }
        }

        // 5. 重新生成
        window.regenerate = function(index) {
            if (isGenerating) return;
            state.history = state.history.slice(0, index);
            const lastUserMsg = state.history.filter(m => m.role === 'user').pop();
            if (lastUserMsg) {
                state.history.pop();
                renderUI();
                sendMessage(lastUserMsg.content);
            }
        };

        // 6. 删除单条消息
        window.deleteMessage = function(index) {
            if (isGenerating) return;
            if (confirm('确定删除这条回复吗？')) {
                state.history.splice(index, 1);
                saveState();
                renderUI();
            }
        };

        // 7. 绑定事件 (使用 addEventListener 更加稳定)
        btnSend.addEventListener('click', function() { sendMessage(userInput.value); });
        
        document.getElementById('btn-clear').addEventListener('click', function() {
            if (confirm('确定清空所有聊天记录吗？')) {
                state.history = [];
                saveState();
                renderUI();
            }
        });

        document.getElementById('btn-settings').addEventListener('click', function() {
            document.getElementById('set-name').value = state.name;
            document.getElementById('set-persona').value = state.persona;
            document.getElementById('set-user-persona').value = state.userPersona;
            document.getElementById('set-first-message').value = state.firstMessage;
            document.getElementById('set-api-url').value = state.apiUrl;
            document.getElementById('set-api-key').value = state.apiKey;
            document.getElementById('set-model').value = state.model;
            document.getElementById('set-css').value = state.globalCss;
            document.getElementById('set-theater').value = state.miniTheater;
            settingsModal.classList.remove('hidden');
        });

        document.getElementById('btn-save').addEventListener('click', function() {
            state.name = document.getElementById('set-name').value.trim() || '未命名角色';
            state.persona = document.getElementById('set-persona').value.trim();
            state.userPersona = document.getElementById('set-user-persona').value.trim();
            state.firstMessage = document.getElementById('set-first-message').value.trim();
            state.apiUrl = document.getElementById('set-api-url').value.trim();
            state.apiKey = document.getElementById('set-api-key').value.trim();
            state.model = document.getElementById('set-model').value.trim();
            state.globalCss = document.getElementById('set-css').value.trim();
            state.miniTheater = document.getElementById('set-theater').value.trim();
            
            if (state.history.length === 0 && state.firstMessage) {
                state.history.push({ role: 'assistant', content: state.firstMessage });
            }
            saveState();
            renderUI();
            settingsModal.classList.add('hidden');
        });

        document.getElementById('btn-close').addEventListener('click', function() {
            settingsModal.classList.add('hidden');
        });

        // 启动
        loadState();
    </script>
</body>
</html>
```
